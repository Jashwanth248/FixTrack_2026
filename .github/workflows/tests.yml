name: Django tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      # Module 6: backup checker tests are plain unittest (tools/ is not a Django app).
      - run: python -m unittest discover -s tools -p "test_*.py" -v
      # Lint gate is scoped to tools/ for now; the older app code has known style debt (see docs/MODULE6_CODE_REVIEW.md).
      - run: python -m flake8 --max-line-length 120 tools/
      # Security scan (SPMP 6.3). Fails the build on any finding.
      - run: python -m bandit -q -r tools maintenance config -x maintenance/tests.py,tools/test_check_backup.py
