<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">FixTrack initial system architecture</title><desc id="desc">Requester, administrator and worker use browser pages. Django validates sessions, forms and permissions, then a workflow service updates requests and history together in SQLite.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#12665d"/></marker></defs><rect width="1000" height="380" rx="12" fill="#f5f8f6"/><g font-family="Arial,sans-serif" fill="#172c36"><text x="35" y="38" font-size="13" font-weight="bold">ONE APPLICATION · THREE ROLES · A SHARED WORKFLOW</text><g fill="white" stroke="#bdd1c7"><rect x="30" y="65" width="200" height="260" rx="12"/><rect x="300" y="65" width="380" height="260" rx="12"/><rect x="750" y="95" width="220" height="200" rx="12"/></g><text x="50" y="100" font-size="21" font-weight="bold">Browser</text><text x="50" y="137" font-size="17">Requester</text><text x="50" y="166" font-size="14">Report and track</text><text x="50" y="204" font-size="17">Administrator</text><text x="50" y="233" font-size="14">Assign and prioritize</text><text x="50" y="271" font-size="17">Worker</text><text x="50" y="300" font-size="14">Start and resolve</text><text x="324" y="100" font-size="21" font-weight="bold">Django application</text><text x="324" y="137" font-size="16">Sessions and role permissions</text><text x="324" y="166" font-size="16">Validated forms and filtered views</text><rect x="322" y="190" width="335" height="109" rx="8" fill="#e1f1e8"/><text x="340" y="220" font-size="17" font-weight="bold">Workflow service</text><text x="340" y="247" font-size="14">State rules + version check</text><text x="340" y="275" font-size="14">One transaction: request + history</text><text x="775" y="130" font-size="21" font-weight="bold">SQLite</text><text x="775" y="172" font-size="16">Users and roles</text><text x="775" y="202" font-size="16">Maintenance requests</text><text x="775" y="232" font-size="16">Change history</text><text x="775" y="262" font-size="16">Login attempts</text><path d="M232 190 H290" fill="none" stroke="#12665d" stroke-width="2" marker-end="url(#arrow)"/><path d="M682 190 H740" fill="none" stroke="#12665d" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="175" font-size="11">Forms</text><text x="692" y="175" font-size="11">ORM</text><text x="30" y="357" font-size="13" fill="#5a6c75">Local demonstration on localhost · HTTPS required before network deployment · No external campus integrations</text></g></svg>
